name: Release Agent Hub CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod

      - name: Resolve CLI version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid CLI release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run Go verification
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          go build ./...

      - name: Test installer
        working-directory: cli
        run: ./scripts/test-installer.sh

      - name: Package macOS release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./cli/scripts/package-release.sh \
            "$VERSION" \
            "$GITHUB_WORKSPACE/dist" \
            preview

      - name: Verify checksums
        working-directory: dist/cli-v${{ steps.version.outputs.value }}
        run: shasum -a 256 -c checksums.txt

      - name: Attest release archives and installer
        uses: actions/attest@v4
        with:
          subject-checksums: dist/cli-v${{ steps.version.outputs.value }}/checksums.txt

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release.json \
            "dist/cli-v$VERSION"/* \
            --verify-tag \
            --title "Agent Hub CLI $VERSION" \
            --generate-notes
