
# pnpm 10+ blocks dependency build scripts unless they are approved. These
# packages have legitimate native/postinstall builds the app needs (argon2 =
# password hashing, onnxruntime-node = local embedder, sharp = image handling,
# the rest are build tooling). pnpm 10 reads `onlyBuiltDependencies`, pnpm 11
# reads `allowBuilds`, so the same list is declared under both keys. Without
# it a fresh `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Transitive dependencies pinned to patched releases (security advisories) —
# the parents (@modelcontextprotocol/sdk, next, ...) still allow the old ranges.
overrides:
  proxy-addr: ^2.0.8
  body-parser: ^2.4.0
  fast-uri: ^3.1.7
  ip-address: ^10.3.1
  source-map-js: ^1.2.2
  'nanoid@>=4 <5.1.16': ^5.1.16
