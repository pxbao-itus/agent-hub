
# pnpm 10+ blocks dependency build scripts by default. These packages have
# legitimate native/postinstall builds the app needs (argon2 = password
# hashing, onnxruntime-node = local embedder, sharp = image handling, the
# rest are build tooling). `onlyBuiltDependencies` is the correct key — the
# previous `allowBuilds:` block with "set this to true or false" placeholder
# values was a no-op, so a fresh `pnpm install` (local, Docker, or CI)
# silently skipped these builds.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - unrs-resolver

# Transitive dependencies pinned to patched releases (security advisories) —
# the parents (@modelcontextprotocol/sdk, next, ...) still allow the old ranges.
overrides:
  proxy-addr: ^2.0.8
  body-parser: ^2.4.0
  fast-uri: ^3.1.7
  ip-address: ^10.3.1
  source-map-js: ^1.2.2
  'nanoid@>=4 <5.1.16': ^5.1.16

# pnpm 11 reads `allowBuilds` (not `onlyBuiltDependencies`) to approve build
# scripts. onnxruntime-node downloads its native binaries in postinstall and is
# required by the local embedder.
allowBuilds:
  onnxruntime-node: true
